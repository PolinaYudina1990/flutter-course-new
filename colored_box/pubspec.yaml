name: colored_box
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.18.0
  json_annotation: ^4.9.0
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg_icons: ^0.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0


flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/json/
    - assets/json/color_data.json
    - assets/icons/
